<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Nitro Profile Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #1a1b2f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: #2b2d42;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            background: #1e1f33;
            padding: 20px;
            border-radius: 15px;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: white;
        }

        .user-info {
            color: white;
        }

        .user-info h2 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .nitro-badge {
            background: linear-gradient(135deg, #6b81ff, #b57cff);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            display: inline-block;
        }

        .login-btn {
            background: #5865f2;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .login-btn:hover {
            background: #4752c4;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .preview-card {
            background: #1e1f33;
            border-radius: 15px;
            padding: 25px;
        }

        .preview-card h3 {
            color: white;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .profile-preview {
            background: #2b2d42;
            border-radius: 10px;
            overflow: hidden;
        }

        .banner {
            height: 150px;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #ff9f4b, #6b5bff);
            background-size: 300% 100%;
            transition: background 0.3s;
        }

        .profile-info {
            padding: 20px;
            position: relative;
            margin-top: -40px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #5865f2;
            border: 4px solid #2b2d42;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            margin-bottom: 10px;
        }

        .profile-name {
            color: white;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .profile-bio {
            background: #1e1f33;
            padding: 15px;
            border-radius: 8px;
            color: #b5b9e0;
            line-height: 1.6;
            margin-top: 10px;
        }

        .tools-section {
            background: #1e1f33;
            border-radius: 15px;
            padding: 25px;
        }

        .tool-group {
            margin-bottom: 30px;
        }

        .tool-group h4 {
            color: white;
            margin-bottom: 15px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bio-builder {
            background: #2b2d42;
            border-radius: 8px;
            padding: 15px;
        }

        .line-input {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .line-input input {
            flex: 1;
            padding: 10px;
            background: #1e1f33;
            border: 2px solid #3d405b;
            border-radius: 5px;
            color: white;
        }

        .line-input button {
            padding: 10px 20px;
            background: #5865f2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .bio-lines {
            background: #1e1f33;
            padding: 15px;
            border-radius: 5px;
            color: white;
            font-family: monospace;
            min-height: 100px;
        }

        .gradient-picker {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .gradient-option {
            height: 60px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .gradient-option:hover {
            transform: scale(1.05);
            border-color: white;
        }

        .gradient-option.selected {
            border-color: #5865f2;
            box-shadow: 0 0 15px #5865f2;
        }

        .emoji-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .emoji-btn {
            background: #2b2d42;
            border: 2px solid #3d405b;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 20px;
            transition: 0.2s;
        }

        .emoji-btn:hover {
            background: #5865f2;
            border-color: #5865f2;
        }

        .emoji-btn.selected {
            background: #5865f2;
            border-color: #5865f2;
        }

        .save-btn {
            background: #3ba55c;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: 0.2s;
        }

        .save-btn:hover {
            background: #2d8b4a;
        }

        .save-btn:disabled {
            background: #4a4f6b;
            cursor: not-allowed;
        }

        .status-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }

        .status-message.success {
            background: #3ba55c20;
            color: #3ba55c;
            border: 1px solid #3ba55c;
            display: block;
        }

        .status-message.error {
            background: #ed424520;
            color: #ed4245;
            border: 1px solid #ed4245;
            display: block;
        }

        .scope-note {
            margin-top: 20px;
            padding: 10px;
            background: #332e41;
            border-radius: 5px;
            color: #b5b9e0;
            font-size: 14px;
            border-left: 4px solid #f0b232;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="user-section" id="userSection">
                <div class="avatar" id="avatar">
                    <i class="fab fa-discord"></i>
                </div>
                <div class="user-info">
                    <h2 id="username">Not Logged In</h2>
                    <span class="nitro-badge" id="nitroStatus">Nitro Required</span>
                </div>
            </div>
            <button class="login-btn" id="loginBtn" onclick="login()">
                <i class="fab fa-discord"></i> Login with Discord
            </button>
        </div>

        <div class="main-content">
            <div class="preview-card">
                <h3><i class="fas fa-eye"></i> Live Profile Preview</h3>
                <div class="profile-preview">
                    <div class="banner" id="previewBanner" style="background: linear-gradient(90deg, #5865f2, #9b59b6)"></div>
                    <div class="profile-info">
                        <div class="profile-avatar" id="previewAvatar">
                            <i class="fab fa-discord"></i>
                        </div>
                        <div class="profile-name" id="previewName">Username#0000</div>
                        <div class="profile-status" id="previewStatus" style="margin-bottom: 10px; color: #b5b9e0;">
                            <span id="previewEmoji">🎮</span> Online
                        </div>
                        <div class="profile-bio" id="previewBio">
                            Click login to start
                        </div>
                    </div>
                </div>
            </div>

            <div class="tools-section">
                <h3 style="color: white; margin-bottom: 20px; font-size: 24px;">
                    <i class="fas fa-magic"></i> Nitro Profile Tools
                </h3>

                <!-- Bio Tool -->
                <div class="tool-group">
                    <h4><i class="fas fa-feather-alt"></i> Animated Bio Builder</h4>
                    <div class="bio-builder">
                        <div class="line-input">
                            <input type="text" id="bioInput" placeholder="Type a line...">
                            <button onclick="addBioLine()" id="addBioBtn" disabled>Add</button>
                        </div>
                        <div class="bio-lines" id="bioLines"></div>
                        <button class="save-btn" onclick="saveBio()" id="saveBioBtn" disabled>
                            <i class="fas fa-save"></i> Save Bio to Discord
                        </button>
                    </div>
                </div>

                <!-- Gradient Banner Tool -->
                <div class="tool-group">
                    <h4><i class="fas fa-palette"></i> Gradient Banner</h4>
                    <div class="gradient-picker" id="gradientPicker">
                        <div class="gradient-option" style="background: linear-gradient(90deg, #5865f2, #9b59b6)" onclick="selectGradient(this, 'linear-gradient(90deg, #5865f2, #9b59b6)')"></div>
                        <div class="gradient-option" style="background: linear-gradient(90deg, #ff6b6b, #feca57)" onclick="selectGradient(this, 'linear-gradient(90deg, #ff6b6b, #feca57)')"></div>
                        <div class="gradient-option" style="background: linear-gradient(90deg, #57f287, #5865f2)" onclick="selectGradient(this, 'linear-gradient(90deg, #57f287, #5865f2)')"></div>
                        <div class="gradient-option" style="background: linear-gradient(90deg, #f0b232, #ed4245)" onclick="selectGradient(this, 'linear-gradient(90deg, #f0b232, #ed4245)')"></div>
                        <div class="gradient-option" style="background: linear-gradient(90deg, #9b59b6, #3498db)" onclick="selectGradient(this, 'linear-gradient(90deg, #9b59b6, #3498db)')"></div>
                        <div class="gradient-option" style="background: linear-gradient(90deg, #1abc9c, #e67e22)" onclick="selectGradient(this, 'linear-gradient(90deg, #1abc9c, #e67e22)')"></div>
                    </div>
                    <button class="save-btn" onclick="saveBanner()" id="saveBannerBtn" disabled>
                        <i class="fas fa-save"></i> Save Banner to Discord
                    </button>
                </div>

                <!-- Status Emoji Tool -->
                <div class="tool-group">
                    <h4><i class="fas fa-smile"></i> Status Emoji</h4>
                    <div class="emoji-selector" id="emojiSelector">
                        <button class="emoji-btn" onclick="selectEmoji(this, '🎮')">🎮</button>
                        <button class="emoji-btn" onclick="selectEmoji(this, '🎧')">🎧</button>
                        <button class="emoji-btn" onclick="selectEmoji(this, '🌙')">🌙</button>
                        <button class="emoji-btn" onclick="selectEmoji(this, '💻')">💻</button>
                        <button class="emoji-btn" onclick="selectEmoji(this, '📚')">📚</button>
                        <button class="emoji-btn" onclick="selectEmoji(this, '⚡')">⚡</button>
                    </div>
                    <button class="save-btn" onclick="saveStatus()" id="saveStatusBtn" disabled>
                        <i class="fas fa-save"></i> Save Status to Discord
                    </button>
                </div>

                <div class="scope-note" id="scopeNote">
                    <i class="fas fa-info-circle"></i>
                    Login required to modify your profile. We request only necessary permissions.
                </div>

                <div id="statusMessage" class="status-message"></div>
            </div>
        </div>
    </div>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script>
        // Discord OAuth2 Configuration
        const CLIENT_ID = '1477301598962323546'; // You need to register your app
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        const DISCORD_API = 'https://discord.com/api/v10';
        
        // State
        let accessToken = null;
        let userData = null;
        let selectedGradient = null;
        let selectedEmoji = '🎮';
        let bioLines = [];

        // Check for OAuth2 callback
        const urlParams = new URLSearchParams(window.location.hash.substring(1));
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        
        if (hashParams.get('access_token')) {
            accessToken = hashParams.get('access_token');
            localStorage.setItem('discord_token', accessToken);
            window.location.hash = '';
            fetchUserData();
        } else {
            // Check localStorage
            const savedToken = localStorage.getItem('discord_token');
            if (savedToken) {
                accessToken = savedToken;
                fetchUserData();
            }
        }

        // Login function
        function login() {
            const scopes = ['identify', 'guilds', 'guilds.members.read'];
            const oauthUrl = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${scopes.join('%20')}`;
            window.location.href = oauthUrl;
        }

        // Fetch user data from Discord
        async function fetchUserData() {
            try {
                const response = await fetch(`${DISCORD_API}/users/@me`, {
                    headers: {
                        Authorization: `Bearer ${accessToken}`
                    }
                });

                if (!response.ok) throw new Error('Failed to fetch user data');

                userData = await response.json();
                
                // Update UI
                document.getElementById('username').textContent = `${userData.username}#${userData.discriminator}`;
                document.getElementById('previewName').textContent = `${userData.username}#${userData.discriminator}`;
                document.getElementById('loginBtn').innerHTML = '<i class="fas fa-check"></i> Logged In';
                document.getElementById('loginBtn').disabled = true;
                
                // Check Nitro
                if (userData.premium_type > 0) {
                    document.getElementById('nitroStatus').innerHTML = '✨ NITRO ACTIVE';
                }
                
                // Enable tools
                document.getElementById('addBioBtn').disabled = false;
                document.getElementById('saveBioBtn').disabled = false;
                document.getElementById('saveBannerBtn').disabled = false;
                document.getElementById('saveStatusBtn').disabled = false;
                
                // Load user's current data
                loadUserData();
                
                showStatus('Successfully logged in!', 'success');
                
            } catch (error) {
                console.error('Error:', error);
                showStatus('Failed to load user data', 'error');
                logout();
            }
        }

        // Load user's current data (you'd need a backend to store this)
        function loadUserData() {
            // In a real app, you'd fetch from your database
            const savedBio = localStorage.getItem(`bio_${userData.id}`);
            const savedBanner = localStorage.getItem(`banner_${userData.id}`);
            const savedEmoji = localStorage.getItem(`emoji_${userData.id}`);
            
            if (savedBio) {
                bioLines = JSON.parse(savedBio);
                updateBioDisplay();
            }
            
            if (savedBanner) {
                document.getElementById('previewBanner').style.background = savedBanner;
            }
            
            if (savedEmoji) {
                selectedEmoji = savedEmoji;
                document.getElementById('previewEmoji').textContent = savedEmoji;
            }
        }

        // Bio functions
        function addBioLine() {
            const input = document.getElementById('bioInput');
            if (input.value.trim()) {
                bioLines.push(input.value.trim());
                updateBioDisplay();
                input.value = '';
            }
        }

        function updateBioDisplay() {
            document.getElementById('bioLines').innerHTML = bioLines.join('<br>');
            document.getElementById('previewBio').innerHTML = bioLines.join('<br>') || 'Click add to build your bio';
        }

        async function saveBio() {
            try {
                // This requires a backend server to store the bio
                // Discord API doesn't have an endpoint to set bio directly
                
                // You'd send to your backend:
                // await fetch('https://your-backend.com/api/save-bio', {
                //     method: 'POST',
                //     headers: {
                //         'Authorization': `Bearer ${accessToken}`,
                //         'Content-Type': 'application/json'
                //     },
                //     body: JSON.stringify({ bio: bioLines, userId: userData.id })
                // });
                
                localStorage.setItem(`bio_${userData.id}`, JSON.stringify(bioLines));
                showStatus('Bio saved locally! (Backend needed for Discord sync)', 'success');
                
            } catch (error) {
                showStatus('Error saving bio', 'error');
            }
        }

        // Banner functions
        function selectGradient(element, gradient) {
            document.querySelectorAll('.gradient-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedGradient = gradient;
            document.getElementById('previewBanner').style.background = gradient;
        }

        async function saveBanner() {
            if (!selectedGradient) {
                showStatus('Select a gradient first', 'error');
                return;
            }
            
            try {
                // Discord API doesn't have a banner endpoint for users
                // This would require a backend and Discord Bot with proper permissions
                
                localStorage.setItem(`banner_${userData.id}`, selectedGradient);
                showStatus('Banner preview saved! (Discord API limitation)', 'success');
                
            } catch (error) {
                showStatus('Error saving banner', 'error');
            }
        }

        // Status functions
        function selectEmoji(element, emoji) {
            document.querySelectorAll('.emoji-btn').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedEmoji = emoji;
            document.getElementById('previewEmoji').textContent = emoji;
        }

        async function saveStatus() {
            try {
                // Set custom status via Discord API
                const response = await fetch(`${DISCORD_API}/users/@me/settings`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        custom_status: {
                            text: '',
                            emoji_name: selectedEmoji
                        }
                    })
                });

                if (!response.ok) throw new Error('Failed to set status');
                
                localStorage.setItem(`emoji_${userData.id}`, selectedEmoji);
                showStatus('Status updated successfully!', 'success');
                
            } catch (error) {
                console.error('Error:', error);
                showStatus('Error setting status. Make sure you have the correct permissions.', 'error');
            }
        }

        function showStatus(message, type) {
            const status = document.getElementById('statusMessage');
            status.textContent = message;
            status.className = `status-message ${type}`;
            
            setTimeout(() => {
                status.style.display = 'none';
            }, 5000);
        }

        function logout() {
            accessToken = null;
            userData = null;
            localStorage.removeItem('discord_token');
            window.location.reload();
        }
    </script>
</body>
</html>
