<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Tools · GitHub Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0a0c1c;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: #14182b;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            border: 1px solid #2a3150;
        }

        /* Header with auth */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            background: #1a1f35;
            padding: 20px 30px;
            border-radius: 20px;
            border: 1px solid #3d4265;
        }

        .logo h1 {
            color: white;
            font-size: 2.2rem;
            background: linear-gradient(135deg, #9f7aea, #667eea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-card {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #252b45;
            padding: 8px 20px 8px 12px;
            border-radius: 50px;
            border: 1px solid #4a5280;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.8rem;
        }

        .user-info p {
            color: #a5b3e0;
            font-size: 0.85rem;
        }

        .user-info h3 {
            color: white;
            font-size: 1.1rem;
        }

        .nitro-badge {
            background: linear-gradient(135deg, #6b81ff, #b57cff);
            padding: 4px 12px;
            border-radius: 30px;
            color: white;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .login-btn {
            background: #5865f2;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #8692fa;
        }

        .login-btn:hover {
            background: #4752c4;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Main grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        /* Profile preview */
        .preview-card {
            background: #1a1f35;
            border-radius: 25px;
            padding: 25px;
            border: 1px solid #3d4265;
        }

        .preview-card h2 {
            color: white;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-container {
            background: #0f1424;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #3d4265;
        }

        .banner {
            height: 150px;
            background: linear-gradient(90deg, #5865f2, #9b59b6);
            background-size: 300% 100%;
            transition: background 0.3s;
            position: relative;
        }

        .banner.animated {
            animation: gradientShift 5s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .profile-info {
            padding: 20px;
            position: relative;
            margin-top: -40px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #5865f2;
            border: 4px solid #0f1424;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
            margin-bottom: 10px;
        }

        .profile-name {
            color: white;
            font-size: 1.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-status {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #a5b3e0;
            margin: 10px 0;
            font-size: 1.2rem;
        }

        .profile-bio {
            background: #0f1424;
            border: 1px solid #3d4265;
            padding: 15px;
            border-radius: 15px;
            color: white;
            font-family: monospace;
            line-height: 1.6;
            margin-top: 15px;
        }

        /* Tools panel */
        .tools-panel {
            background: #1a1f35;
            border-radius: 25px;
            padding: 25px;
            border: 1px solid #3d4265;
        }

        .tools-panel h2 {
            color: white;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tool-section {
            margin-bottom: 30px;
            background: #0f1424;
            padding: 20px;
            border-radius: 20px;
        }

        .tool-section h3 {
            color: white;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bio-builder {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .line-input {
            display: flex;
            gap: 10px;
        }

        .line-input input {
            flex: 1;
            padding: 12px;
            background: #1a1f35;
            border: 2px solid #3d4265;
            border-radius: 10px;
            color: white;
        }

        .line-input button {
            padding: 12px 25px;
            background: #5865f2;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .line-input button:hover {
            background: #4752c4;
        }

        .bio-display {
            background: #1a1f35;
            padding: 15px;
            border-radius: 10px;
            color: white;
            font-family: monospace;
            min-height: 100px;
            border: 1px solid #3d4265;
        }

        .gradient-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px 0;
        }

        .gradient-option {
            height: 60px;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .gradient-option:hover {
            transform: scale(1.05);
            border-color: white;
        }

        .gradient-option.selected {
            border-color: #5865f2;
            box-shadow: 0 0 15px #5865f2;
        }

        .emoji-grid {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        .emoji-option {
            background: #1a1f35;
            border: 2px solid #3d4265;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.5rem;
            transition: 0.2s;
        }

        .emoji-option:hover {
            background: #5865f2;
            border-color: #5865f2;
        }

        .emoji-option.selected {
            background: #5865f2;
            border-color: #5865f2;
        }

        .action-btn {
            width: 100%;
            padding: 15px;
            background: #3ba55c;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn:hover {
            background: #2d8b4a;
        }

        .action-btn:disabled {
            background: #4a4f6b;
            cursor: not-allowed;
        }

        .status-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            display: none;
        }

        .status-message.success {
            background: #3ba55c20;
            border: 1px solid #3ba55c;
            color: #3ba55c;
            display: block;
        }

        .status-message.error {
            background: #ed424520;
            border: 1px solid #ed4245;
            color: #ed4245;
            display: block;
        }

        .info-note {
            background: #252b45;
            border-left: 5px solid #f0b232;
            padding: 15px;
            border-radius: 10px;
            color: #ffd966;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <h1>✨ Discord Tools · GitHub Edition</h1>
            </div>
            <div class="auth-section">
                <div class="user-card" id="userCard" style="display: none;">
                    <div class="avatar" id="avatar">D</div>
                    <div class="user-info">
                        <p>logged in as</p>
                        <h3 id="username">Loading...</h3>
                    </div>
                    <span class="nitro-badge" id="nitroBadge">Nitro</span>
                </div>
                <button class="login-btn" id="loginBtn" onclick="login()">
                    <i class="fab fa-discord"></i> Login with Discord
                </button>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="main-grid">
            <!-- Profile Preview -->
            <div class="preview-card">
                <h2><i class="fas fa-eye"></i> Live Preview</h2>
                <div class="profile-container">
                    <div class="banner" id="bannerPreview"></div>
                    <div class="profile-info">
                        <div class="profile-avatar" id="avatarPreview">🎮</div>
                        <div class="profile-name" id="namePreview">Username#0000</div>
                        <div class="profile-status">
                            <span id="statusEmojiPreview">🎮</span>
                            <span>Online</span>
                        </div>
                        <div class="profile-bio" id="bioPreview">
                            Click login to start
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tools -->
            <div class="tools-panel">
                <h2><i class="fas fa-magic"></i> Nitro Tools</h2>

                <!-- Bio Tool -->
                <div class="tool-section">
                    <h3><i class="fas fa-feather-alt"></i> Bio Builder</h3>
                    <div class="bio-builder">
                        <div class="line-input">
                            <input type="text" id="bioInput" placeholder="Type a line..." disabled>
                            <button onclick="addBioLine()" id="addBioBtn" disabled>Add</button>
                        </div>
                        <div class="bio-display" id="bioDisplay"></div>
                        <button class="action-btn" onclick="saveBio()" id="saveBioBtn" disabled>
                            <i class="fas fa-save"></i> Save Bio
                        </button>
                    </div>
                </div>

                <!-- Banner Tool -->
                <div class="tool-section">
                    <h3><i class="fas fa-palette"></i> Gradient Banner</h3>
                    <div class="gradient-grid" id="gradientGrid">
                        <div class="gradient-option" style="background: linear-gradient(90deg, #5865f2, #9b59b6)" onclick="selectGradient(this, 'linear-gradient(90deg, #5865f2, #9b59b6)')"></div>
                        <div class="gradient-option" style="background: linear-gradient(90deg, #ff6b6b, #feca57)" onclick="selectGradient(this, 'linear-gradient(90deg, #ff6b6b, #feca57)')"></div>
                        <div class="gradient-option" style="background: linear-gradient(90deg, #57f287, #5865f2)" onclick="selectGradient(this, 'linear-gradient(90deg, #57f287, #5865f2)')"></div>
                        <div class="gradient-option" style="background: linear-gradient(90deg, #f0b232, #ed4245)" onclick="selectGradient(this, 'linear-gradient(90deg, #f0b232, #ed4245)')"></div>
                        <div class="gradient-option" style="background: linear-gradient(90deg, #9b59b6, #3498db)" onclick="selectGradient(this, 'linear-gradient(90deg, #9b59b6, #3498db)')"></div>
                        <div class="gradient-option" style="background: linear-gradient(90deg, #1abc9c, #e67e22)" onclick="selectGradient(this, 'linear-gradient(90deg, #1abc9c, #e67e22)')"></div>
                    </div>
                    <button class="action-btn" onclick="saveBanner()" id="saveBannerBtn" disabled>
                        <i class="fas fa-save"></i> Apply Banner
                    </button>
                </div>

                <!-- Status Emoji Tool -->
                <div class="tool-section">
                    <h3><i class="fas fa-smile"></i> Status Emoji</h3>
                    <div class="emoji-grid" id="emojiGrid">
                        <button class="emoji-option" onclick="selectEmoji(this, '🎮')">🎮</button>
                        <button class="emoji-option" onclick="selectEmoji(this, '🎧')">🎧</button>
                        <button class="emoji-option" onclick="selectEmoji(this, '🌙')">🌙</button>
                        <button class="emoji-option" onclick="selectEmoji(this, '💻')">💻</button>
                        <button class="emoji-option" onclick="selectEmoji(this, '📚')">📚</button>
                        <button class="emoji-option" onclick="selectEmoji(this, '⚡')">⚡</button>
                        <button class="emoji-option" onclick="selectEmoji(this, '🎵')">🎵</button>
                        <button class="emoji-option" onclick="selectEmoji(this, '🌈')">🌈</button>
                    </div>
                    <button class="action-btn" onclick="saveStatus()" id="saveStatusBtn" disabled>
                        <i class="fas fa-save"></i> Set Status
                    </button>
                </div>

                <div class="info-note" id="infoNote">
                    <i class="fas fa-info-circle"></i>
                    Login required to enable tools. Your data is saved locally in your browser.
                </div>

                <div id="statusMessage" class="status-message"></div>
            </div>
        </div>
    </div>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script>
        // =============================================
        // DISCORD OAUTH2 FOR GITHUB PAGES
        // USING IMPLICIT GRANT (TOKEN IN URL HASH)
        // =============================================
        
        const CLIENT_ID = '1477301598962323546';
        const REDIRECT_URI = 'https://timshadow1.github.io/discordtools';
        
        // Scopes needed
        const SCOPES = ['identify', 'guilds.join', 'guilds.members.read'];
        
        // State
        let accessToken = null;
        let userData = null;
        let selectedGradient = null;
        let selectedEmoji = '🎮';
        let bioLines = [];

        // Check for token in URL hash (Implicit Grant)
        function checkTokenFromHash() {
            const hash = window.location.hash.substring(1);
            if (hash) {
                const params = new URLSearchParams(hash);
                const token = params.get('access_token');
                const tokenType = params.get('token_type');
                
                if (token && tokenType === 'Bearer') {
                    accessToken = token;
                    localStorage.setItem('discord_token', token);
                    // Clean URL
                    window.location.hash = '';
                    fetchUserData();
                    return true;
                }
            }
            
            // Check localStorage
            const savedToken = localStorage.getItem('discord_token');
            if (savedToken) {
                accessToken = savedToken;
                fetchUserData();
                return true;
            }
            
            return false;
        }

        // Login with Implicit Grant (works on GitHub Pages)
        function login() {
            const authUrl = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${SCOPES.join('%20')}`;
            window.location.href = authUrl;
        }

        // Fetch user data from Discord
        async function fetchUserData() {
            try {
                const response = await fetch('https://discord.com/api/users/@me', {
                    headers: {
                        Authorization: `Bearer ${accessToken}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch user data');
                }

                userData = await response.json();
                
                // Update UI
                document.getElementById('userCard').style.display = 'flex';
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('avatar').textContent = userData.username[0].toUpperCase();
                document.getElementById('username').textContent = `${userData.username}#${userData.discriminator}`;
                document.getElementById('namePreview').textContent = `${userData.username}#${userData.discriminator}`;
                
                // Check Nitro
                if (userData.premium_type > 0) {
                    document.getElementById('nitroBadge').style.display = 'inline-block';
                } else {
                    document.getElementById('nitroBadge').style.display = 'none';
                }
                
                // Enable tools
                enableTools();
                
                // Load saved data
                loadUserData();
                
                showStatus('✅ Successfully logged in!', 'success');
                
            } catch (error) {
                console.error('Error:', error);
                showStatus('Failed to load user data', 'error');
                logout();
            }
        }

        // Enable all tools
        function enableTools() {
            document.getElementById('bioInput').disabled = false;
            document.getElementById('addBioBtn').disabled = false;
            document.getElementById('saveBioBtn').disabled = false;
            document.getElementById('saveBannerBtn').disabled = false;
            document.getElementById('saveStatusBtn').disabled = false;
        }

        // Load user's saved data from localStorage
        function loadUserData() {
            if (!userData) return;
            
            const savedBio = localStorage.getItem(`bio_${userData.id}`);
            const savedBanner = localStorage.getItem(`banner_${userData.id}`);
            const savedEmoji = localStorage.getItem(`emoji_${userData.id}`);
            
            if (savedBio) {
                bioLines = JSON.parse(savedBio);
                updateBioDisplay();
            }
            
            if (savedBanner) {
                document.getElementById('bannerPreview').style.background = savedBanner;
            }
            
            if (savedEmoji) {
                selectedEmoji = savedEmoji;
                document.getElementById('statusEmojiPreview').textContent = savedEmoji;
            }
        }

        // Bio functions
        function addBioLine() {
            const input = document.getElementById('bioInput');
            if (input.value.trim()) {
                bioLines.push(input.value.trim());
                updateBioDisplay();
                input.value = '';
            }
        }

        function updateBioDisplay() {
            const display = bioLines.join('<br>') || '✨ Your bio will appear here';
            document.getElementById('bioDisplay').innerHTML = display;
            document.getElementById('bioPreview').innerHTML = display;
        }

        async function saveBio() {
            if (!userData) return;
            
            try {
                localStorage.setItem(`bio_${userData.id}`, JSON.stringify(bioLines));
                showStatus('✅ Bio saved locally!', 'success');
                
                // Try to set custom status (works via API)
                await setCustomStatus();
                
            } catch (error) {
                showStatus('Error saving bio', 'error');
            }
        }

        // Banner functions
        function selectGradient(element, gradient) {
            document.querySelectorAll('.gradient-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedGradient = gradient;
            document.getElementById('bannerPreview').style.background = gradient;
        }

        async function saveBanner() {
            if (!userData || !selectedGradient) {
                showStatus('Select a gradient first', 'error');
                return;
            }
            
            try {
                localStorage.setItem(`banner_${userData.id}`, selectedGradient);
                showStatus('✅ Banner preview saved!', 'success');
            } catch (error) {
                showStatus('Error saving banner', 'error');
            }
        }

        // Status emoji functions
        function selectEmoji(element, emoji) {
            document.querySelectorAll('.emoji-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedEmoji = emoji;
            document.getElementById('statusEmojiPreview').textContent = emoji;
        }

        async function saveStatus() {
            if (!userData) return;
            
            try {
                localStorage.setItem(`emoji_${userData.id}`, selectedEmoji);
                
                // Set custom status via Discord API
                await setCustomStatus();
                
                showStatus('✅ Status emoji saved!', 'success');
            } catch (error) {
                console.error('Error:', error);
                showStatus('Error saving status', 'error');
            }
        }

        // Set custom status via Discord API
        async function setCustomStatus() {
            try {
                const response = await fetch('https://discord.com/api/users/@me/settings', {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        custom_status: {
                            text: '',
                            emoji_name: selectedEmoji
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to set status');
                }

                return true;
            } catch (error) {
                console.warn('Could not set status via API:', error);
                return false;
            }
        }

        // Show status message
        function showStatus(message, type) {
            const status = document.getElementById('statusMessage');
            status.textContent = message;
            status.className = `status-message ${type}`;
            
            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);
        }

        // Logout
        function logout() {
            accessToken = null;
            userData = null;
            localStorage.removeItem('discord_token');
            window.location.reload();
        }

        // Initialize
        window.onload = function() {
            checkTokenFromHash();
        };
    </script>
</body>
</html>
